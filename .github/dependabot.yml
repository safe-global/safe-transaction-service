version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # Celery 5.7.0 gevent workers stop consuming with a startup backlog (#3115)
      # and are capped at ~10 messages/s by `_quick_drain` in `synloop`.
      - dependency-name: "celery"
        versions: [">=5.7.0"]
    groups:
      django:
        patterns:
          - "django*"
          - "drf*"
        update-types:
          - minor
          - patch
      eth:
        patterns:
          - "safe-eth-py"
          - "web3"
          - "eth-*"
        update-types:
          - minor
          - patch
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/docker/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      # A new Python version also needs changes in pyproject.toml and CI, so it is
      # upgraded by hand. Patch releases still come from Dependabot.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
